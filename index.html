<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Neural Core AR - WebXR Demo</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
 body{margin:0;overflow:hidden}
 #hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#fff;font:14px sans-serif;text-shadow:0 0 4px #000;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="hint">Point the camera at the target image</div>
<a-scene id="scene" mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 1; filterMinCF: 0.001; filterBeta: 10; uiScanning: yes; uiLoading: yes;"
  gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="core" src="./assets/neural_core.glb"></a-asset-item>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity position="0 0 0.4" scale="0.45 0.45 0.45" animation="property: position; to: 0 0.08 0.4; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
      <a-gltf-model src="#core" animation="property: rotation; to: 0 360 0; dur: 14000; loop: true; easing: linear"></a-gltf-model>
    </a-entity>
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" intensity="1.5" position="1 2 2"></a-light>
  </a-entity>
</a-scene>
<script>
 if (location.search.indexOf('stats') > -1) document.getElementById('scene').setAttribute('stats', '');
 document.getElementById('scene').addEventListener('targetFound', function(){document.getElementById('hint').style.display='none'});
</script>
</body>
</html>
