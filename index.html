<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Neural Core AR — Browser-Based Augmented Reality Demo</title>

  <!-- SEO & Social -->
  <meta name="description" content="Point your phone camera at the target image to see a 3D neural core materialize in augmented reality. No app install required — runs entirely in the browser.">
  <meta name="author" content="skilloutofbounds">
  <meta property="og:title" content="Neural Core AR">
  <meta property="og:description" content="Browser-based markerless augmented reality powered by MindAR + A-Frame. Point your camera at the target to see a floating 3D model.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://skilloutofbounds.github.io/neural-core-ar/">

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      color: #fff;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-shadow: 0 0 4px #000;
      pointer-events: none;
      z-index: 9;
    }
  </style>
</head>
<body>

  <!-- User hint — hidden once the target is detected -->
  <div id="hint">Point the camera at the target image</div>

  <!-- AR Scene -->
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./assets/targets.mind;
                  maxTrack: 1;
                  filterMinCF: 0.001;
                  filterBeta: 10;
                  uiScanning: yes;
                  uiLoading: yes;"
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- Preload assets -->
    <a-assets>
      <a-asset-item id="core" src="./assets/neural_core.glb"></a-asset-item>
    </a-assets>

    <!-- Camera (AR passthrough, no look-controls) -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Tracked entity — appears when the target image is detected -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Hover animation wrapper -->
      <a-entity
        position="0 0 0.4"
        scale="0.45 0.45 0.45"
        animation="property: position;
                   to: 0 0.08 0.4;
                   dir: alternate;
                   dur: 1800;
                   loop: true;
                   easing: easeInOutSine"
      >
        <!-- 3D model with continuous rotation -->
        <a-gltf-model
          src="#core"
          animation="property: rotation;
                     to: 0 360 0;
                     dur: 14000;
                     loop: true;
                     easing: linear"
        ></a-gltf-model>
      </a-entity>

      <!-- Lighting -->
      <a-light type="ambient" intensity="1.2"></a-light>
      <a-light type="directional" intensity="1.5" position="1 2 2"></a-light>
    </a-entity>
  </a-scene>

  <script>
    // Enable A-Frame stats panel when ?stats is in the URL
    if (location.search.indexOf("stats") > -1) {
      document.getElementById("scene").setAttribute("stats", "");
    }

    // Hide the hint text once the target image is found
    document.getElementById("scene").addEventListener("targetFound", function () {
      document.getElementById("hint").style.display = "none";
    });
  </script>
</body>
</html>
